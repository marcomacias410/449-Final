# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Database (MySQL)
# Override with -e SPRING_DATASOURCE_URL/USERNAME/PASSWORD when running in Docker
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/gamebacklog?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# JWT
# Override secret with -e JWT_SECRET=<your-256-bit-secret>
# Secret must be at least 32 characters (256 bits) for HS256
# ===============================
jwt.secret=${JWT_SECRET:ThisIsAVerySecureSecretKeyForJwtSigningHS256AlgorithmCpsc449}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# Error response — hide stack traces from API responses
# ===============================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
